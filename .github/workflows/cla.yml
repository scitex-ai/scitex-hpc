name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard).
#
# WHY THIS FILE IS SHAPED THE WAY IT IS — read before simplifying it back.
#
# `issue_comment` and `pull_request_target` are UNAUTHENTICATED triggers on a
# public repo: a GitHub account is the whole barrier. Whatever this caller hands
# to the callee is therefore handed to a job a stranger can start. Two
# consequences, both deliberate below.
#
#   1. EXPLICIT SECRET MAPPING, NOT `secrets: inherit`.
#      `inherit` forwards EVERY secret this repo holds. Measured 2026-08-02,
#      scitex-hpc holds two:
#          GH_PERSONAL_ACCESS_TOKEN      — the CLA-signature-storage PAT; needed
#          CLAUDE_CODE_CREDENTIALS_JSON  — the fleet Claude credential; NOT needed
#      The CLA has no use for the second one, so `inherit` was placing a fleet
#      credential next to third-party CLA code for no benefit. The callee declares
#      `secrets: GH_PERSONAL_ACCESS_TOKEN: required: true` precisely so a caller
#      can pass the one secret instead. This is the supported path, not a
#      workaround. The hazard is CREDENTIAL ADJACENCY, not which runner is used —
#      so this mapping is correct independently of where the callee runs.
#
#   2. THE CALLEE IS PINNED BY SHA, NOT `@main`.
#      A mutable org-level ref means one change to the reusable lands in every
#      calling repo at once with no review in any of them — and the code it
#      lands in holds a write token and a PAT, in a job an outsider can trigger.
#      Pinning takes reusable updates deliberately. Bump the SHA after READING
#      the diff; do not restore `@main` to avoid the bump.
#
# THE RUNNER, WHICH THIS PIN BUMP IS ABOUT
# ---------------------------------------
# This file used to record that the callee's jobs "still declare
# `runs-on: [self-hosted, Linux, X64, spartan-cpu]` ... so CLA code still
# executes on persistent shared university hardware". That was true at the old
# pin and is NOT true at this one.
#
#   pin 1c593985  main@2026-07-31   both jobs hard-coded to the Spartan pool
#   pin 57e2e772  main@2026-08-11   runs-on: ${{ fromJSON(inputs.runs_on) }}
#                                   default '["ubuntu-latest"]'
#   pin f5d19f5b  main@2026-08-30   signature branch
#                                   `cla-signatures` -> `cla` (#44); the
#                                   #113 bump set this
#                                   SHA but left the
#                                   `# main@2026-08-11`
#                                   comment and this
#                                   table stale.
#   pin b507cc0e  main@2026-08-31   THIS BUMP:
#                                   only callee change since the previous
#                                   pin is #46
#                                   (90b5645): fork PRs
#                                   route to `ubuntu-latest` instead of
#                                   being refused on every
#                                   self-hosted job;
#                                   `cla.yml` is byte-identical at
#                                   the two SHAs, so this bump changes
#                                   no behaviour; it lands this caller
#                                   on the latest reviewed callee code
#                                   and keeps the `# main@<date>`
#                                   comment true.
#
# The callee's own words for why the default inverted: "DEFAULT IS ubuntu-latest
# BECAUSE THIS JOB IS OUTSIDER-TRIGGERABLE ... A compromise on an ephemeral
# hosted VM costs one disposable runner; on the pool it costs the fleet
# credential."
#
# We pass no `runs_on`, deliberately, so we take that default. This repo has no
# speed case for the pool here — CLAssistant measured at 8s.
#
# AND THIS IS WHY THE PIN NEEDED A BUMP RATHER THAN NOTHING: a SHA-pinned
# consumer does not observe upstream fixes. The callee gained the `runs_on`
# input on 2026-08-05 and the hosted default on 2026-08-11; this caller sat on
# 07-31 code through both and would have kept executing on Spartan
# indefinitely, with every run green. The callee measured the same shape from
# its side: "of 17 consumer repos, 17 pass nothing and inherit it. The escape
# hatch existed for five days and nobody used it, because a default is not a
# decision anyone makes -- it is one they never see."

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    # CLAssistant posts its commit status via a raw Statuses-API call with a
    # hardcoded context "CLAssistant" (not tied to this job id) — no
    # required-status-check rename needed.
    uses: scitex-ai/.github/.github/workflows/cla.yml@b507cc0e03f47d75c24e5cbe7830f32b5a3a2e25 # main@2026-08-31
    # owner_allowlist overridden: this repo's allowlist has an extra
    # "LLEmacs" entry beyond the reusable workflow's "bot*,ywatanabe1989" default.
    # Taking the default would start demanding a CLA signature from an
    # already-allowlisted contributor.
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    # CLAssistant posts its commit status via a raw Statuses-API call with a
    # hardcoded context "CLAssistant" (not tied to this job id) — no
    # required-status-check rename needed.
    # owner_allowlist overridden: this repo's allowlist has an extra
    # "LLEmacs" entry beyond the reusable workflow's "bot*,ywatanabe1989" default.
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit
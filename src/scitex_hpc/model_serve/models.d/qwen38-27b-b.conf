# qwen38-27b-b -- SECOND Qwen3.8 replica, pinned to the second card of a
# two-GPU allocation. Operator 2026-08-15: one instance PER GPU, not one
# model spread across GPUs.
#
# CUDA_VISIBLE_DEVICES is exported here because serve-model.sh SOURCES this
# conf, so an export in it reaches the vllm child. Without it both replicas
# land on GPU 0 and the second OOMs against the first.
#
# A DISTINCT KEY IS LOAD-BEARING, not cosmetic: serve-model.sh derives the log
# paths, the /tmp cache dir and the discovery file from $KEY. Reusing the key
# qwen38-27b would make two nodes interleave one log and overwrite one
# discovery file -- exactly what made the gpgpu011 -> gpgpu178 handover hard
# to read on 2026-08-15.
#
# Ports continue the central allocation. RESERVED: 18765 (codex provider).
# 18772 belongs to muse; 18773 is replica A.
#
# ---------------------------------------------------------------------------
# 2026-09-03: FP8 WEIGHTS + DEEPGEMM + N-GRAM SPECULATION.
# Operator, same day, authorising the switch: 「FP16を使うと言う事は無いので、
# すぐに再起動してください」, and on FP8's accuracy cost 「その落ちる具合が
# QWENでは大したことがない…許容範囲」.
#
# MEASURED THAT DAY on this exact card, two runs each at matched prompts:
#   BF16                        45.0 tok/s   first token 0.501 s
#   FP8                         60.1         0.104
#   FP8 + DeepGEMM              80.7         0.091
#   FP8 + DeepGEMM + n-gram     96.0 on novel text, 216.4 on copy-edit work
#
# 1M CONTEXT IS MEASURED, NOT PREDICTED. This replica was switched first,
# deliberately at 524288 so a failed start could be attributed to the weight
# format alone; it reported 41.54 GiB of KV cache / 1,275,868 tokens. Only
# then was the ceiling raised, and the second start reported 1,309,937 tokens
# and === READY. The primary followed with the identical figure. (An earlier
# version of this comment said the context "stays at 524288 for now"; that
# was true for one start on 2026-09-03 and has not been true since.)
#
# DEEPGEMM IS HOPPER-ONLY. Correct on this H100; it must NOT be set on the
# L40S bridge conf, which is Ada. It accelerates FP8 matrix multiplies only,
# so the flag without the FP8 checkpoint does nothing at all.
#
# N-GRAM SPECULATION IS LOSSLESS by construction -- the draft proposes, the
# target verifies every token and rejects anything it would not have written --
# so it changes speed and never output. 51% of proposed tokens were accepted.
# vLLM disables async scheduling while it is on; that cost is inside the
# numbers above.
#
# REASONING EFFORT IS NOT SETTABLE HERE. He asked for it low, and there is no
# server-side flag: vLLM takes thinking_token_budget PER REQUEST. What the
# server contributes is --reasoning-parser qwen3, already present, which is
# what makes the budget effective at all. Setting the value is the caller's
# job; a comment claiming otherwise here would be a lie that reads as config.
# ---------------------------------------------------------------------------
export CUDA_VISIBLE_DEVICES=1
export VLLM_USE_DEEP_GEMM=${VLLM_USE_DEEP_GEMM:-1}
MODEL_PATH=/data/scratch/projects/punim0264/ywatanabe/hf/Qwen3.8-27B-FP8
SERVED_NAME=qwen38-27b
VLLM_PORT=8769
LITELLM_PORT=4004
TUNNEL_PORT=18774
TP=1
GPU_MEM_UTIL=0.92
MAX_MODEL_LEN=1048576
MAX_NUM_SEQS=4
EXTRA_VLLM_ARGS="--enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --enable-prefix-caching --mamba-cache-mode align --kv-cache-dtype fp8 --speculative-config {\"method\":\"ngram\",\"num_speculative_tokens\":5,\"prompt_lookup_min\":2,\"prompt_lookup_max\":4} --hf-overrides {\"text_config\":{\"max_position_embeddings\":1048576}}"

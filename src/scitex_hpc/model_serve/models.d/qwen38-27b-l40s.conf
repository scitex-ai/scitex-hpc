export CUDA_VISIBLE_DEVICES=0
# qwen38-27b-l40s -- BRIDGE replica for the H100 gap.
#
# WHY THIS EXISTS. Job 29644207 (2x H100) ends 2026-09-04 and its queued
# successor is not estimated to start until 2026-09-13, so handyman-01 loses
# its backend for about ten days. Shortening the request does not help: a
# 1-day and a 7-day H100 request return the same estimate, because the wait
# is priority, not backfill. The preemptible L40S partition starts the same
# day, which is the only thing on this cluster that closes the gap.
#
# ONLY FP8 FITS. An L40S is 48 GB. The BF16 checkpoint resides at 53 GiB and
# does not fit at all; the FP8 checkpoint resides at 27.4 GiB and leaves room
# for the cache. The FP8 work is what makes this bridge possible.
#
# DEEPGEMM IS DELIBERATELY ABSENT. Its kernels are Hopper-only, and an L40S
# is Ada. serve-model.sh does not set VLLM_USE_DEEP_GEMM, so leaving it unset
# here is correct -- do not copy the H100 launch's export into this conf.
#
# PREEMPTIBLE MEANS CANCELLED. PreemptMode=CANCEL on this partition, so the
# job dies outright when a priority job wants the card; submit it with
# --requeue so it returns to the queue instead of vanishing.
#
# PORTS ARE DISTINCT ON PURPOSE. This replica may run alongside the H100 job
# for several hours before that job's walltime. Reusing its tunnel port would
# collide on the bastion, and an ssh forward collision returns an EMPTY reply
# rather than an error, which is the hardest failure of all to read.
MODEL_PATH=/data/scratch/projects/punim0264/ywatanabe/hf/Qwen3.8-27B-FP8
SERVED_NAME=qwen38-27b
VLLM_PORT=8773
LITELLM_PORT=4007
TUNNEL_PORT=18777
TP=1
GPU_MEM_UTIL=0.92
# 262,144 rather than the H100's 524,288: the cache budget here is about
# 13 GiB against 20 GiB there. Raise it once an engine has actually started
# and reported its free KV blocks.
MAX_MODEL_LEN=262144
MAX_NUM_SEQS=4
# n-gram speculative decoding is carried here because it is lossless by
# construction -- the draft only proposes, the target verifies every token and
# rejects anything it would not have written -- so it changes speed and not
# output. Measured on the H100 the same day: 80 -> 96 tok/s on novel text and
# 80 -> 216 on copy-edit work, with 51% of proposed tokens accepted. It needs
# no draft model. vLLM disables async scheduling while it is on, which is a
# small cost under heavy concurrency and irrelevant at this replica's load.
EXTRA_VLLM_ARGS="--enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --enable-prefix-caching --mamba-cache-mode align --kv-cache-dtype fp8 --speculative-config {\"method\":\"ngram\",\"num_speculative_tokens\":5,\"prompt_lookup_min\":2,\"prompt_lookup_max\":4} --hf-overrides {\"text_config\":{\"max_position_embeddings\":262144}}"

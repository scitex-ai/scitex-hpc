# qwen38-27b -- Qwen3.8-27B, arch Qwen3_5ForConditionalGeneration
# (hybrid linear attention + vision encoder). TP=1 fits one H100 80GB at
# util 0.92. Submit with --gpus-per-node=1.
# Ports continue the central allocation: vllm 8768 / litellm 4003 / tunnel 18773.
# 18765 stays RESERVED for the codex provider.
#
# NOTE this conf sets NO CUDA_VISIBLE_DEVICES, unlike qwen38-27b-b which pins
# to card 1. That is deliberate and unchanged here: this replica takes the
# first visible card. Adding a pin would move it.
#
# ---------------------------------------------------------------------------
# 2026-09-03: FP8 WEIGHTS + DEEPGEMM + N-GRAM SPECULATION + 1M CONTEXT.
# Operator authorised the switch the same day 「FP16を使うと言う事は無いので、
# すぐに再起動してください」, accepted FP8's accuracy cost 「その落ちる具合が
# QWENでは大したことがない…許容範囲」, and asked for 1M context.
#
# MEASURED on this card, two runs each at matched prompts:
#   BF16                        45.0 tok/s   first token 0.501 s
#   FP8                         60.1         0.104
#   FP8 + DeepGEMM              80.7         0.091
#   FP8 + DeepGEMM + n-gram     96.0 on novel text, 216.4 on copy-edit work
#
# 1M IS MEASURED, NOT PREDICTED, and that is why it is here. The standby
# replica was switched first and reported, at 524288:
#   Available KV cache memory: 41.54 GiB   GPU KV cache size: 1,275,868 tokens
# then at 1048576:
#   GPU KV cache size: 1,309,937 tokens    === READY ===
# against BF16's 19.32 GiB / 619,613. So the ceiling is real with room to spare.
#
# WHY BOTH REPLICAS MUST MATCH, which is the reason this file changed at all:
# agents reach the pool through the hoist proxy, which round-robins across
# 18773 and 18774. With one replica at 1M and the other at 524288, a long
# context SUCCEEDS or FAILS depending on which member the router picked. That
# is a correctness problem, not a speed difference, so the pair is changed
# together or not at all.
#
# DEEPGEMM IS HOPPER-ONLY. Correct on this H100; it must NOT be copied to the
# L40S bridge conf, which is Ada. It accelerates FP8 matrix multiplies only,
# so the flag without the FP8 checkpoint does nothing.
#
# N-GRAM SPECULATION IS LOSSLESS by construction -- the draft proposes, the
# target verifies every token and rejects anything it would not have written.
# 51% of proposed tokens were accepted. vLLM disables async scheduling while it
# is on; that cost is inside the numbers above.
# ---------------------------------------------------------------------------
export VLLM_USE_DEEP_GEMM=1
MODEL_PATH=/data/scratch/projects/punim0264/ywatanabe/hf/Qwen3.8-27B-FP8
SERVED_NAME=qwen38-27b
VLLM_PORT=8768
LITELLM_PORT=4003
TUNNEL_PORT=18773
TP=1
GPU_MEM_UTIL=0.92
MAX_MODEL_LEN=1048576
MAX_NUM_SEQS=4
EXTRA_VLLM_ARGS="--enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --enable-prefix-caching --mamba-cache-mode align --kv-cache-dtype fp8 --speculative-config {\"method\":\"ngram\",\"num_speculative_tokens\":5,\"prompt_lookup_min\":2,\"prompt_lookup_max\":4} --hf-overrides {\"text_config\":{\"max_position_embeddings\":1048576}}"

[Unit]
# Drop-in template. Install as:
#   ~/.config/systemd/user/<unit>.service.d/onfailure.conf
#
# A Type=oneshot/Restart=none unit driven by a timer has NO supervision, so a
# failure reaches nobody without this line. A Restart= unit does not need it as
# urgently: OnFailure fires only once StartLimitBurst is exhausted, so systemd
# already distinguishes transient from terminal there.
#
# A drop-in is used rather than editing the unit file so the change is additive
# and reversible, and so units owned by other agents are never modified.
OnFailure=scitex-unit-failed@%n.service
